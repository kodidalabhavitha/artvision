<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Art Lens</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; }
  </style>
</head>
<body>
  <a-scene
    mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: true;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video id="paintingVideo" src="./assets/Kalamkari_peacock.mp4"
             preload="auto" loop="true" playsinline webkit-playsinline muted></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" id="target">
      <a-video src="#paintingVideo" width="1" height="1" position="0 0 0"></a-video>
    </a-entity>
  </a-scene>

  <script>
    const video = document.querySelector("#paintingVideo");
    const target = document.querySelector("#target");
    target.addEventListener("targetFound", () => video.play());
    target.addEventListener("targetLost", () => video.pause());
  </script>
</body>
</html>
