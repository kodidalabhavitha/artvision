services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: artvision
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: artvision
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artvision"]
      interval: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://artvision:${DB_PASSWORD}@db:5432/artvision
      ADMIN_API_KEY: ${ADMIN_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./frontend:/frontend:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
